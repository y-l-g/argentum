max_width = 100
reorder_imports = true
comment_width = 100
wrap_comments = true
format_code_in_doc_comments = true
doc_comment_code_block_width = 100
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# `components/primitives/` mirrors topcoat-ui-registry verbatim (ADR-0007):
# reformatting it breaks the byte-exact `cargo xtask verify-topcoat-ui`
# contract. Owned code in `components/composites/` formats normally.
ignore = ["crates/argentum-ui/src/components/primitives"]
