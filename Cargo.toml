[workspace]
resolver = "2"
members = [
    "crates/argentum-core",
    "crates/argentum-macros",
    "crates/argentum-ui",
    "examples/showcase",
    "xtask",
]
exclude = [
    "benchmarks/argentum",
    "benchmarks/axum-maud",
    "benchmarks/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_lines = "allow"

# Topcoat and Toasty are git dependencies tracking their `main` branches:
# Cargo fetches them from GitHub and Cargo.lock pins the exact commit, so no
# sibling clone is needed — locally or in CI. Bump deliberately with
# `cargo update -p topcoat` / `cargo update -p toasty`. For temporary
# live-editing against a local checkout, add an uncommitted `[patch]`
# section redirecting to `../topcoat` / `../toasty` (see ADR-0003).
[workspace.dependencies]
# TEMPORARY (feedback/topcoat-pr-373): pinned to PR tokio-rs/topcoat#373
# (`view-stream`, head 30d92c99) to trial streaming SSR + `live!`/`emit!`.
# Revert to `branch = "main"` once the PR lands or feedback is filed.
topcoat = { git = "https://github.com/tokio-rs/topcoat", branch = "view-stream", default-features = false, features = ["view", "router", "discover"] }
toasty = { git = "https://github.com/tokio-rs/toasty", branch = "main", default-features = false, features = ["sqlite", "jiff"] }
toasty-core = { git = "https://github.com/tokio-rs/toasty", branch = "main" }
topcoat-ui = { git = "https://github.com/tokio-rs/topcoat", branch = "view-stream" }
topcoat-ui-registry = { git = "https://github.com/tokio-rs/topcoat", branch = "view-stream" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
