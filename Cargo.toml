[workspace]
resolver = "2"
members = [
    "crates/tablo-core",
    "crates/tablo-macros",
    "crates/tablo-ui",
    "examples/showcase",
    "xtask",
]
exclude = [
    "benchmarks/tablo",
    "benchmarks/axum-maud",
    "benchmarks/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
# Deny warnings through cargo's lint channel rather than a global
# `RUSTFLAGS=-Dwarnings`. RUSTFLAGS is hashed into every unit's fingerprint, so
# toggling it (CI vs. local, or a one-off `RUSTFLAGS=-Dwarnings cargo clippy`)
# invalidates the whole dependency graph; the lint table applies the same policy
# as part of the profile, without partitioning the build cache. Members opt in
# with `[lints] workspace = true`. This covers workspace members only, which is
# the intent — denying warnings in dependencies is upstream's business.
warnings = "deny"

[workspace.lints.clippy]
too_many_lines = "allow"

# Topcoat and Toasty are git dependencies tracking their `main` branches, pinned by
# Cargo.lock. Bump deliberately (`cargo update -p topcoat -p toasty`, then `cargo check
# --offline`); sync `benchmarks/tablo/Cargo.lock` in the same commit. See
# CONTRIBUTING.md "Dependency pins" (GH #103). `topcoat fmt` needs the CLI built from the
# locked rev (see the fmt job in `.github/workflows/ci.yml`). For temporary live-editing
# against a local checkout, add an uncommitted `[patch]` section redirecting to
# `../topcoat` / `../toasty`.
[workspace.dependencies]
topcoat = { git = "https://github.com/tokio-rs/topcoat", branch = "main", default-features = false, features = ["view", "router", "discover"] }
toasty = { git = "https://github.com/tokio-rs/toasty", branch = "main", default-features = false, features = ["sqlite", "jiff"] }
toasty-core = { git = "https://github.com/tokio-rs/toasty", branch = "main" }
topcoat-ui = { git = "https://github.com/tokio-rs/topcoat", branch = "main" }
topcoat-ui-registry = { git = "https://github.com/tokio-rs/topcoat", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
