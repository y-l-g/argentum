# Labels for y-l-g/argentum.
#
# This file is the source of truth for repository labels. It is synced by
# `.github/workflows/labels.yml`. Update this file — not the GitHub UI —
# when adding or changing labels.
#
# See `docs/dev/LABELS.md` for the labeling scheme and how each label
# should be used.

# Applied by an issue template.
- name: bug
  description: "Something is not working."
  color: "d73a4a"
- name: enhancement
  description: "New feature or request"
  color: "a2eeef"
- name: upstream
  description: "Missing/unstable upstream Toasty or Topcoat API"
  color: "1d76db"

# Triage roles. One at a time; a maintainer sets and replaces them.
- name: needs-triage
  description: "Maintainer needs to evaluate this issue"
  color: "fbca04"
- name: needs-info
  description: "Waiting on reporter for more information"
  color: "d4c5f9"
- name: ready-for-agent
  description: "Fully specified, ready for an AFK agent"
  color: "0e8a16"
- name: ready-for-human
  description: "Requires human implementation"
  color: "b60205"

# Applied by a maintainer.
- name: accessibility
  description: "Barrier affecting people with disabilities"
  color: "f143ab"
- name: documentation
  description: "Improvements or additions to documentation"
  color: "0075ca"
- name: duplicate
  description: "This issue or pull request already exists"
  color: "cfd3d7"
- name: good first issue
  description: "Good for newcomers"
  color: "7057ff"
- name: help wanted
  description: "Extra attention is needed"
  color: "008672"
- name: invalid
  description: "This doesn't seem right"
  color: "e4e669"
- name: question
  description: "Further information is requested"
  color: "d876e3"
- name: wontfix
  description: "This will not be worked on"
  color: "ffffff"
