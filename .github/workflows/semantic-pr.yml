name: "Semantic PR"

# Enforces the title format docs/dev/COMMITS.md requires. Branches
# squash-merge into master, so the title becomes the landed commit:
# `<type>(<scope>): <description> (#123)`. Without this check a
# malformed title merges silently and the history drifts.
# Modeled on tokio-rs/topcoat's semantic-pr.yml.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# Each push to a PR branch re-runs this check. Cancel the superseded
# run (safe: this only ever runs on PRs).
concurrency:
  group: semantic-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  main:
    name: pr title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Lowercase subject per COMMITS.md, plus the mandatory issue
          # reference suffix: `(#123)` or `(#205, #219)`.
          subjectPattern: ^(?![A-Z]).*\(#[\d,\s#]+\)$
          subjectPatternError: |
            The subject must start with a lowercase letter and end with the issue reference, e.g. `feat(table): bound the filters signal (#205)`.
