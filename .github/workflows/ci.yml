name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # The workspace depends on Topcoat and Toasty through local path deps
  # (../topcoat, ../toasty), which Cargo.lock cannot pin. CI checks out the
  # revisions recorded here — bump them deliberately when the siblings
  # advance, so an upstream push can never break master nondeterministically.
  TOPCOAT_REV: 961e45510e6807f5b644a22ae9ff4828c7f99131
  TOASTY_REV: 8f30365a7ae4b93192a0afc53a596f355ca7a6ca

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned sibling repos
        run: |
          git init ../topcoat
          git -C ../topcoat fetch --depth 1 origin "$TOPCOAT_REV"
          git -C ../topcoat checkout FETCH_HEAD
          git init ../toasty
          git -C ../toasty fetch --depth 1 origin "$TOASTY_REV"
          git -C ../toasty checkout FETCH_HEAD
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned sibling repos
        run: |
          git init ../topcoat
          git -C ../topcoat fetch --depth 1 origin "$TOPCOAT_REV"
          git -C ../topcoat checkout FETCH_HEAD
          git init ../toasty
          git -C ../toasty fetch --depth 1 origin "$TOASTY_REV"
          git -C ../toasty checkout FETCH_HEAD
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned sibling repos
        run: |
          git init ../topcoat
          git -C ../topcoat fetch --depth 1 origin "$TOPCOAT_REV"
          git -C ../topcoat checkout FETCH_HEAD
          git init ../toasty
          git -C ../toasty fetch --depth 1 origin "$TOASTY_REV"
          git -C ../toasty checkout FETCH_HEAD
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # `-p` scopes rustfmt to workspace members; `cargo fmt --all` would also
      # walk the sibling path deps (../topcoat, ../toasty) and check them with
      # Argentum's config.
      - run: >-
          cargo fmt -p argentum-core -p argentum-macros -p argentum-ui
          -p showcase -p xtask -- --check
      - name: Install topcoat CLI (for `topcoat fmt`)
        run: |
          cargo install --path ../topcoat/crates/topcoat-cli --locked
      - name: topcoat fmt
        run: |
          topcoat fmt
          git diff --exit-code
