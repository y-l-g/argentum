name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# Warning denial lives in [workspace.lints.rust] (Cargo.toml), not in RUSTFLAGS:
# RUSTFLAGS is hashed into every unit's fingerprint, so setting it here forced a
# from-scratch rebuild whenever it differed from a contributor's local build.

# Topcoat and Toasty are git dependencies (branch `main`) pinned by the
# committed Cargo.lock — nothing to clone here. Bump them deliberately with
# `cargo update -p topcoat` / `cargo update -p toasty`.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # The auth feature ships on by default and is opt-out; the opt-out path
      # must compile *and* pass its tests (GH #129). `Panel::build` refuses a
      # panel that has not called `.auth(Auth::disabled())`, so
      # `default-features = false` stays a real escape hatch an app asks for
      # explicitly (GH #282).
      - run: cargo test -p tablo-core --no-default-features --locked

  # The JS assets are plain browser scripts loaded through `asset!`: no build
  # step, no dependencies, nothing to install, and the runner's Node runs them
  # as-is. A job of its own keeps a JS failure attributable to the assets and
  # off the Rust job's queue. The suites are named rather than globbed: a glob
  # would silently shrink the run when a suite is renamed, while a missing path
  # fails the job.
  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          node --test
          crates/tablo-ui/assets/selects.test.js
          crates/tablo-ui/assets/bulk.test.js
          crates/tablo-ui/assets/dialog.test.js
          crates/tablo-ui/assets/mutation-submit.test.js
          crates/tablo-ui/assets/notifications.test.js
          crates/tablo-ui/assets/filters.test.js
          examples/showcase/assets/media.test.js

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Nothing else here builds the docs: `cargo test` and `cargo clippy` never
      # run rustdoc, so 44 errors in tablo-core (broken intra-doc links to
      # private items, unclosed HTML tags, an unparseable Rust code block)
      # accumulated unnoticed and left the Pages workflow red on master.
      # `-D warnings` promotes every rustdoc lint to a failure, so the next one
      # breaks this job instead of printing a warning nobody reads. Workspace
      # only: the detached benchmarks/* are separate workspaces.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2
      # docs.yml publishes the guide, but it only runs on master, so a broken
      # relative link would reach the site before anything caught it. Build the
      # book here too: it is seconds, and linkcheck fails the build on a bad link.
      - run: mdbook build docs/guide

  msrv:
    name: msrv (1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The workspace MSRV floor (Cargo.toml rust-version, rust-toolchain.toml
      # comment): a `main`-tracking dep can silently raise what it needs
      # (GH #175), so pin the floor even though day-to-day CI rides stable.
      - run: rustup toolchain install 1.98 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.98 check --workspace --locked

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The workspace check runs on the pinned nightly: rustfmt.toml's keys are
      # nightly-only (GH #269) and stable rustfmt ignores them with a warning.
      # The date is fixed so the rustfmt version the gate enforces cannot move
      # without a commit here; rust-toolchain.toml records the choice. The
      # default toolchain stays stable so the detached-bench `cargo fmt` steps
      # below and the topcoat-cli build keep running on it.
      - run: rustup update stable && rustup default stable
      - run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      # `fmt --all` covers every workspace member; the detached benches
      # (workspace `exclude`) keep their own stable checks below.
      - run: cargo +nightly-2026-08-24 fmt --all -- --check
      # The detached benches have their own workspaces/lockfiles (GH #175):
      # check each in its own directory.
      - name: fmt detached benches
        run: |
          for bench in benchmarks/tablo benchmarks/axum-maud benchmarks/leptos; do
            echo "--- fmt --check $bench"
            (cd "$bench" && cargo fmt -- --check)
          done
      - name: Install topcoat CLI (for `topcoat fmt`)
        # Install the formatter built from the same topcoat revision the
        # workspace locks (Cargo.lock) — the version-matched install the CLI
        # itself recommends ("depends on topcoat 0.6.2, but the topcoat CLI
        # is 0.7.0"), precise to the rev because the workspace tracks a
        # moving branch. Reading the rev from the lock keeps library and
        # formatter in lockstep through every `cargo update -p topcoat`.
        run: |
          REV=$(grep -A 2 '^name = "topcoat"$' Cargo.lock | grep -o '#[0-9a-f]\{40\}' | head -1 | cut -c2-)
          test -n "$REV" || { echo "could not read topcoat rev from Cargo.lock"; exit 1; }
          echo "Installing topcoat-cli at locked revision $REV"
          cargo install --git https://github.com/tokio-rs/topcoat --rev "$REV" topcoat-cli --locked
      - name: topcoat fmt
        run: |
          topcoat fmt
          git diff --exit-code

  udeps:
    name: udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update nightly && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-udeps --locked
      # Unused-dependency guard (GH #271). `--all-features` keeps a dependency
      # that only a non-default feature pulls in from looking unused.
      - run: cargo +nightly udeps --workspace --all-targets --all-features --locked

  bench-check:
    name: bench-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The bench workspace is detached (see workspace `exclude`), so it
          # has its own target dir and lockfile.
          workspaces: benchmarks/tablo
      # Compile the harness locked: it rotted once (#103) and nothing else in
      # CI would notice, because `cargo test --workspace` never sees it.
      - name: Check detached bench workspace (locked)
        run: cargo check --locked --manifest-path benchmarks/tablo/Cargo.toml
      # Same blind spot as fmt had (GH #175): `clippy --workspace` never sees
      # the detached bench, so lint it by manifest path.
      - name: Clippy detached bench workspace (locked)
        run: cargo clippy --locked --manifest-path benchmarks/tablo/Cargo.toml --all-targets -- -D warnings
      # Pin policy (Cargo.toml comment / ADR-0003): the bench must measure the
      # same upstream revs the workspace ships, so the two lockfiles stay in
      # lockstep through every `cargo update -p topcoat|toasty`.
      - name: Lockstep pin check (workspace vs bench)
        run: |
          for crate in topcoat toasty; do
            root=$(grep -A 2 "^name = \"$crate\"$" Cargo.lock | grep -o '#[0-9a-f]\{40\}' | head -1)
            bench=$(grep -A 2 "^name = \"$crate\"$" benchmarks/tablo/Cargo.lock | grep -o '#[0-9a-f]\{40\}' | head -1)
            if [ -z "$root" ] || [ "$root" != "$bench" ]; then
              echo "::error::$crate rev drift: workspace=$root bench=$bench"
              exit 1
            fi
            echo "$crate: $root (in sync)"
          done
