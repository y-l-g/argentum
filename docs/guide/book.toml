[book]
title = "Argentum Guide"
authors = ["Argentum contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/y-l-g/argentum"
edit-url-template = "https://github.com/y-l-g/argentum/edit/master/docs/guide/src/{path}"

# `optional = true` warns instead of failing when the linkcheck binary is missing locally;
# with it installed (CI) broken links still fail the build.
[output.linkcheck2]
optional = true
