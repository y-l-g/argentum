[alias]
xtask = "run --package xtask --"

# Timing profile: this workspace compiles ~250 dependency crates plus 16
# integration test binaries of 155-181 MB each, so profile knobs are worth more
# here than the cargo defaults.
#
# codegen-units: the dev profile default, stated explicitly so a machine-wide
# cargo config cannot scale it back down. Setting it to 1 serializes codegen
# inside each crate -- exactly wrong for the heaviest units here (tablo-core,
# showcase and its test binaries) and it also makes linking slower by producing
# fewer, larger object files.
#
# debug = 1 is line tables only: enough for backtraces and breakpoints, and
# measurably cheaper than the default `debug = 2`.
[profile.dev]
codegen-units = 16
debug = 1

[profile.test]
codegen-units = 16
debug = 1
