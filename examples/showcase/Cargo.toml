[package]
name = "showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Showcase: single example demonstrating every Argentum feature with snippets + rendered results."

[dependencies]
argentum-core = { path = "../../crates/argentum-core" }
argentum-ui = { path = "../../crates/argentum-ui" }
toasty.workspace = true
tokio.workspace = true
topcoat = { workspace = true, features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime"] }
uuid.workspace = true

[build-dependencies]
argentum-ui = { path = "../../crates/argentum-ui" }
topcoat = { path = "../../../topcoat/crates/topcoat", default-features = false, features = ["tailwind"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"

[lints]
workspace = true
