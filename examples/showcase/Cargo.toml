[package]
name = "showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Showcase: real-world Panel demo (Users, Authors, Posts) exercising every Argentum feature through real resources."

# GH #179 / ADR-0015: one integration-test binary per crate. Cargo autodiscovers
# every file under `tests/` as its own target, which is exactly the per-file
# link cost this consolidation removes — so the module files are declared as one
# target and autodiscovery stays off.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
argentum-core = { path = "../../crates/argentum-core" }
argentum-ui = { path = "../../crates/argentum-ui" }
jiff.workspace = true
toasty.workspace = true
# `fs` is for the demo uploader's `tokio::fs` write (GH #188).
tokio = { workspace = true, features = ["fs"] }
topcoat = { workspace = true, features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime"] }
uuid.workspace = true

[build-dependencies]
argentum-ui = { path = "../../crates/argentum-ui" }
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
form_urlencoded = "1.2"
http = "1"
http-body-util = "0.1"
# Query counting for the no-N+1 test (GH #187): toasty's sqlite driver emits a
# `driver exec` tracing event per statement, so a subscriber scoped to the test
# counts what one page render issues. `tracing` itself is already a dependency
# of argentum-core.
tracing = "0.1"
tracing-subscriber = "0.3"

[lints]
workspace = true
