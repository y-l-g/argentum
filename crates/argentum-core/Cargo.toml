[package]
name = "argentum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core toolkit types for Argentum, a server-rendered admin toolkit on Topcoat and Toasty."

# GH #179 / ADR-0015: one integration-test binary per crate. Cargo autodiscovers
# every file under `tests/` as its own target, which is exactly the per-file
# link cost this consolidation removes — so the module files are declared as one
# target and autodiscovery stays off.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
argentum-macros = { path = "../argentum-macros" }
argentum-ui = { path = "../argentum-ui" }
argon2 = { version = "0.6", optional = true }
bytes = "1"
form_urlencoded = "1.2"
heck = "0.5"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
jiff.workspace = true
password-hash = { version = "0.6", optional = true, features = ["getrandom"] }
subtle = "2"
serde.workspace = true
tokio.workspace = true
toasty.workspace = true
toasty-core.workspace = true
# `fs` is for `Panel::serve_dir` (GH #188): serving an upload directory is a
# panel-level route, and upstream the directory route lives behind that feature.
topcoat = { workspace = true, features = ["view", "router", "discover", "asset", "font", "runtime", "cookie", "multipart", "icon", "fs"] }
tracing = "0.1"
uuid.workspace = true

[features]
default = ["auth"]
auth = ["dep:argon2", "dep:password-hash", "topcoat/session"]

[dev-dependencies]
serde_json = "1"
tokio.workspace = true

[lints]
workspace = true
