[package]
name = "argentum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core toolkit types for Argentum, a server-rendered admin toolkit on Topcoat and Toasty."

[dependencies]
argentum-macros = { path = "../argentum-macros" }
argentum-ui = { path = "../argentum-ui" }
argon2 = { version = "0.5", optional = true, features = ["std"] }
form_urlencoded = "1.2"
http = "1"
jiff.workspace = true
password-hash = { version = "0.6", optional = true, features = ["getrandom"] }
toasty.workspace = true
toasty-core.workspace = true
topcoat = { workspace = true, features = ["view", "router", "discover", "asset", "font", "runtime", "cookie", "multipart"] }
tracing = "0.1"
uuid.workspace = true

[features]
default = ["auth"]
auth = ["dep:argon2", "dep:password-hash", "topcoat/session"]

[dev-dependencies]
http-body-util = "0.1"
tokio.workspace = true

[lints]
workspace = true
