[toolchain]
# Track stable rustc, matching tokio-rs/topcoat. Topcoat 0.8 declares
# rust-version = 1.98 and Toasty 0.10 declares 1.95, so the workspace MSRV is
# the higher floor: 1.98. Stable today satisfies it and keeps up as the
# topcoat/toasty git deps advance.
channel = "stable"
# Explicit so every checkout (including CI images without the default profile)
# has the tools the fmt/clippy jobs need.
components = ["rustfmt", "clippy"]
# The `fmt` CI job does not use this toolchain: it checks the workspace with
# `cargo +nightly-2026-08-24 fmt`, because rustfmt.toml's keys are nightly-only
# (GH #269). The date is pinned so the rustfmt version the gate enforces cannot
# move without a commit here; this comment records the choice, and `ci.yml` plus
# the gate list in CONTRIBUTING.md and the install hint in
# .agents/skills/check/SKILL.md name the same toolchain.
